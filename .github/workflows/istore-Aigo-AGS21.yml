name: istore-Aigo-AGS21

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  DEVICE_NAME: istore-Aigo-AGS21
  REPO_URL: https://github.com/dailook/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: istore/istore-Aigo-AGS21.config
  DIY_P1_SH: istore/diy-part1.sh
  DIY_P2_SH: istore/diy-part2.sh
  DIY_P3_SH: istore/diy-part3.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
    # =========================================================
    # 0. Checkout
    # =========================================================
    - name: Checkout
      uses: actions/checkout@v4

    # =========================================================
    # 1. 释放空间 + 初始化编译环境
    # =========================================================
    - name: Free disk space & init build environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "=== 释放磁盘空间 ==="
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm
        sudo docker image prune --all --force 2>/dev/null || true

        echo "=== 配置 12GB Swap ==="
        sudo swapoff -a 2>/dev/null || true
        sudo rm -f /mnt/swapfile
        sudo fallocate -l 12G /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile
        sudo swapon /mnt/swapfile

        echo "=== 系统更新 ==="
        sudo -E apt-get -yqq purge firefox snapd 2>/dev/null || true
        sudo -E apt-get -yqq update
        sudo -E apt-get -yqq full-upgrade

        echo "=== 安装编译依赖 ==="
        sudo -E apt-get -yqq install \
          clang llvm dwarves build-essential \
          libssl-dev libelf-dev bc flex bison \
          python3 python3-pip xz-utils tar \
          dos2unix libfuse-dev zstd \
          gettext libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk unzip file

        echo "=== 安装 ImmortalWrt 官方编译依赖 ==="
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)' || true

        echo "=== 安装 pnpm ==="
        sudo npm install -g pnpm 2>/dev/null || true

        echo "=== 清理 ==="
        sudo -E apt-get -yqq autoremove --purge
        sudo -E apt-get -yqq clean
        sudo -E timedatectl set-timezone "$TZ"

        sudo mkdir -p /workdir
        sudo chown "$USER":"$USER" /workdir

        echo "=== 磁盘空间 ==="
        df -hT /

        echo "=== 内存/Swap ==="
        free -h

    # =========================================================
    # 2. 克隆源码
    # =========================================================
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT "$PWD"
        git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
        echo "✅ 源码克隆完成"

    # =========================================================
    # 3. 加载自定义 Feeds (diy-part1.sh)
    # =========================================================
    - name: Load custom feeds (diy-part1.sh)
      run: |
        cd openwrt

        # 覆盖 feeds.conf（如果存在）
        if [ -f "$GITHUB_WORKSPACE/$FEEDS_CONF" ]; then
          cp "$GITHUB_WORKSPACE/$FEEDS_CONF" feeds.conf.default
          echo "✅ 已覆盖 feeds.conf.default"
        fi

        # 执行 diy-part1.sh
        if [ -f "$GITHUB_WORKSPACE/$DIY_P1_SH" ]; then
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"
          echo "✅ diy-part1.sh 执行完成"
        else
          echo "⚠️ $DIY_P1_SH 不存在，跳过"
        fi

    # =========================================================
    # 4. 更新并安装 Feeds
    # =========================================================
    - name: Update & install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        echo "✅ Feeds 更新安装完成"

    # =========================================================
    # 5. 加载自定义配置 (diy-part2.sh)
    # =========================================================
    - name: Load custom configuration (diy-part2.sh)
      run: |
        cd openwrt

        # 复制 files 目录
        if [ -d "$GITHUB_WORKSPACE/files" ]; then
          cp -r "$GITHUB_WORKSPACE/files" ./files
          echo "✅ files 目录已复制"
        fi

        # 复制 .config
        if [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          echo "✅ .config 已复制"
        else
          echo "❌ 配置文件 $CONFIG_FILE 不存在！"
          exit 1
        fi

        # 执行 diy-part2.sh
        if [ -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ]; then
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
          "$GITHUB_WORKSPACE/$DIY_P2_SH"
          echo "✅ diy-part2.sh 执行完成"
        else
          echo "⚠️ $DIY_P2_SH 不存在，跳过"
        fi

    # =========================================================
    # 5.5 加载额外配置 (diy-part3.sh)（可选）
    # 注意：不再重复复制 .config，避免覆盖 diy-part2 的修改
    # =========================================================
    - name: Load extra configuration (diy-part3.sh)
      run: |
        cd openwrt

        if [ -f "$GITHUB_WORKSPACE/$DIY_P3_SH" ]; then
          chmod +x "$GITHUB_WORKSPACE/$DIY_P3_SH"
          "$GITHUB_WORKSPACE/$DIY_P3_SH"
          echo "✅ diy-part3.sh 执行完成"
        else
          echo "⚠️ $DIY_P3_SH 不存在，跳过（这是正常的）"
        fi

    # =========================================================
    # 5.6 生成 Toolchain 缓存 Key
    # =========================================================
    - name: Generate toolchain cache key
      id: cache-key
      run: |
        cd openwrt
        make defconfig 1>/dev/null 2>&1

        TARGET=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
        SUBTARGET=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)

        TOOLS_HASH=$(find tools toolchain -type f \( -name "Makefile" -o -name "*.mk" \) \
          -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1)

        CACHE_KEY="toolchain-${TARGET}-${SUBTARGET}-${TOOLS_HASH:0:16}"
        CACHE_PREFIX="toolchain-${TARGET}-${SUBTARGET}"

        echo "CACHE_KEY=$CACHE_KEY" >> "$GITHUB_OUTPUT"
        echo "CACHE_PREFIX=$CACHE_PREFIX" >> "$GITHUB_OUTPUT"

        echo "========================================"
        echo "🔑 缓存 Key: $CACHE_KEY"
        echo "📌 缓存前缀: $CACHE_PREFIX"
        echo "========================================"

    # =========================================================
    # 5.7 恢复 Toolchain — actions/cache
    # =========================================================
    - name: Restore toolchain from actions/cache
      uses: actions/cache/restore@v4
      id: cache-restore
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    # =========================================================
    # 5.8 恢复 Toolchain — Release 备份
    # =========================================================
    - name: Restore toolchain from Release backup
      if: steps.cache-restore.outputs.cache-hit != 'true'
      id: release-restore
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt

        CACHE_KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
        ASSET_NAME="${CACHE_KEY}.tzst"

        # 检查 Release 是否存在
        if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "restored=false" >> "$GITHUB_OUTPUT"
          echo "⚠️ toolchain-cache Release 不存在（首次运行）"
          exit 0
        fi

        # 检查对应资产是否存在
        if gh release view toolchain-cache \
          --repo "$GITHUB_REPOSITORY" \
          --json assets \
          -q '.assets[].name' 2>/dev/null | grep -qx "$ASSET_NAME"; then

          echo "📦 从 Release 下载工具链: $ASSET_NAME"
          gh release download toolchain-cache \
            --repo "$GITHUB_REPOSITORY" \
            -p "$ASSET_NAME" \
            -D .

          if [ -f "$ASSET_NAME" ]; then
            echo "📂 解压工具链缓存..."
            tar -I unzstd -xf "$ASSET_NAME" 2>/dev/null || tar -xf "$ASSET_NAME"
            rm -f "$ASSET_NAME"
            echo "restored=true" >> "$GITHUB_OUTPUT"
            echo "✅ Release 备份恢复成功"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "❌ 下载失败"
          fi
        else
          echo "restored=false" >> "$GITHUB_OUTPUT"
          echo "⚠️ Release 中无匹配缓存: $ASSET_NAME"
        fi

    # =========================================================
    # 5.9 处理 Toolchain 编译
    # =========================================================
    - name: Handle toolchain
      id: toolchain
      run: |
        cd openwrt

        CACHE_HIT="${{ steps.cache-restore.outputs.cache-hit }}"
        RELEASE_HIT="${{ steps.release-restore.outputs.restored }}"

        if [ "$CACHE_HIT" = "true" ]; then
          echo "✅ actions/cache 命中"
          echo "need_build=false" >> "$GITHUB_OUTPUT"
          echo "need_save_cache=false" >> "$GITHUB_OUTPUT"
          echo "need_save_release=false" >> "$GITHUB_OUTPUT"

        elif [ "$RELEASE_HIT" = "true" ]; then
          echo "✅ Release 缓存命中，回写 actions/cache"
          echo "need_build=false" >> "$GITHUB_OUTPUT"
          echo "need_save_cache=true" >> "$GITHUB_OUTPUT"
          echo "need_save_release=false" >> "$GITHUB_OUTPUT"

        else
          echo "⏳ 无缓存，开始编译工具链..."

          make tools/install -j"$(nproc)" || make tools/install -j1 V=s || {
            echo "❌ tools 编译失败"; exit 1;
          }
          echo "✅ tools 完成"

          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s || {
            echo "❌ toolchain 编译失败"; exit 1;
          }
          echo "✅ toolchain 完成"

          echo "need_build=true" >> "$GITHUB_OUTPUT"
          echo "need_save_cache=true" >> "$GITHUB_OUTPUT"
          echo "need_save_release=true" >> "$GITHUB_OUTPUT"
        fi

        # 修改 Makefile 跳过工具链重编
        sed -i 's/ $(tool.*\/stamp-compile)//' Makefile
        echo "📌 Makefile 已修改"

    # =========================================================
    # 5.10 保存 Toolchain 到 actions/cache
    # =========================================================
    - name: Save toolchain to actions/cache
      uses: actions/cache/save@v4
      if: steps.toolchain.outputs.need_save_cache == 'true'
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    # =========================================================
    # 5.11 保存 Toolchain 到 Release 备份
    # =========================================================
    - name: Save toolchain to Release backup
      if: steps.toolchain.outputs.need_save_release == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt

        CACHE_KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
        CACHE_PREFIX="${{ steps.cache-key.outputs.CACHE_PREFIX }}"

        echo "📦 打包工具链..."
        tar -I 'zstd -T0' -cf "${CACHE_KEY}.tzst" staging_dir/host* staging_dir/tool*
        ls -lh "${CACHE_KEY}.tzst"

        # 创建 Release（如不存在）
        if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release create toolchain-cache \
            --repo "$GITHUB_REPOSITORY" \
            --title "Toolchain Cache" \
            --notes "自动生成的工具链缓存，请勿手动删除" \
            --latest=false
        fi

        # 删除同平台旧缓存
        gh release view toolchain-cache \
          --repo "$GITHUB_REPOSITORY" \
          --json assets -q '.assets[].name' 2>/dev/null | \
          grep "^${CACHE_PREFIX}" | while read -r old_file; do
            echo "🗑️ 删除旧缓存: $old_file"
            gh release delete-asset toolchain-cache "$old_file" \
              --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
          done

        # 上传
        gh release upload toolchain-cache "${CACHE_KEY}.tzst" \
          --repo "$GITHUB_REPOSITORY" --clobber

        rm -f "${CACHE_KEY}.tzst"
        echo "✅ 工具链已备份到 Release"

    # =========================================================
    # 6. SSH 调试（可选）
    # =========================================================
    - name: SSH connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')
      timeout-minutes: 30

    # =========================================================
    # 7. 下载软件包
    # =========================================================
    - name: Download packages
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8 || make download -j1 V=s

        # 清理无效下载
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

        echo "✅ 软件包下载完成"

    # =========================================================
    # 8. 编译固件
    # =========================================================
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt

        echo "========================================"
        echo "开始编译 ($(nproc) 线程)"
        echo "========================================"
        df -hT /

        if make -j"$(nproc)"; then
          echo "✅ 多线程编译成功"
        elif make -j1; then
          echo "✅ 单线程编译成功"
        elif make -j1 V=s; then
          echo "✅ 单线程详细日志编译成功"
        else
          echo "❌ 编译失败"
          exit 1
        fi

        echo "========================================"
        echo "固件编译完成"
        df -hT /
        echo "========================================"

        echo "status=success" >> "$GITHUB_OUTPUT"
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    # =========================================================
    # 8.5 空间检查
    # =========================================================
    - name: Check space usage
      if: always()
      run: df -hT

    # =========================================================
    # 9. 上传 bin 目录
    # =========================================================
    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin_${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
        retention-days: 7

    # =========================================================
    # 10. 整理固件文件
    # =========================================================
    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: 7

    # =========================================================
    # 11. 生成 Release 信息
    # =========================================================
    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        AUTHOR=$(echo "${{ env.REPO_URL }}" | sed 's|.*/\([^/]*\)/[^/]*$|\1|')
        DEVICE_NAME="${{ env.DEVICE_NAME }}"
        BRANCH="${{ env.REPO_BRANCH }}"
        BUILD_TIME=$(date +"%Y%m%d-%H%M")

        RELEASE_TAG="${DEVICE_NAME}-${BUILD_TIME}"
        RELEASE_TAG=$(echo "$RELEASE_TAG" | sed 's/[^a-zA-Z0-9._-]/-/g')

        echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

        cat > release.txt << EOF
        ## 🚀 OpenWrt 自动编译固件

        ### 📋 编译信息

        | 项目 | 详情 |
        |------|------|
        | 📱 设备 | \`${DEVICE_NAME}\` |
        | 👤 源码 | \`${AUTHOR}\` |
        | 🔗 仓库 | ${{ env.REPO_URL }} |
        | 🌿 分支 | \`${BRANCH}\` |
        | ⏰ 时间 | $(date '+%Y-%m-%d %H:%M:%S') CST |
        | 🏷️ 标签 | \`${RELEASE_TAG}\` |

        ---
        > ⚠️ 请根据机型选择 Factory 或 Sysupgrade 固件
        EOF

        echo "status=success" >> "$GITHUB_OUTPUT"

    # =========================================================
    # 12. 发布到 GitHub Release
    # =========================================================
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*.bin
          ${{ env.FIRMWARE }}/*.img.gz
          ${{ env.FIRMWARE }}/*.manifest
          ${{ env.FIRMWARE }}/*.tar.gz

    # =========================================================
    # 13. 清理旧 workflow runs
    # =========================================================
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      if: always()
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 1
        keep_minimum_runs: 5

    # =========================================================
    # 14. 清理旧 Release（仅本设备）
    # =========================================================
    - name: Remove old releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 10
        delete_tags: true
        delete_tag_pattern: ${{ env.DEVICE_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
