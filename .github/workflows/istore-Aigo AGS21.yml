name: istore-Aigo AGS21

env:
  DEVICE_NAME: istore-Aigo AGS21
  REPO_URL: https://github.com/dailook/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: istore/istore-Aigo AGS21.config
  DIY_P1_SH: istore/diy-part1.sh
  DIY_P2_SH: istore/diy-part2.sh
  DIY_P3_SH: diy-partX.sh
  UPLOAD_BIN_DIR: false          # ⬅️ 改为 false，避免上传无用中间文件
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  # ✅ 修正：正确的强制 Node 版本环境变量
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    # =========================================================
    # 1. 释放空间 + 初始化编译环境（优化版）
    # =========================================================
    - name: Free disk space & init build environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # ✅ 更彻底的清理（含 .NET SDK 多版本、Haskell、Android NDK）
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
          /usr/local/.ghcup /usr/local/share/powershell /usr/share/swift
        
        sudo docker image prune --all --force
        sudo docker system prune -af --volumes

        # ✅ 优化 Swap：12G + 调整 swappiness 减少不必要换页
        sudo swapoff -a && sudo rm -f /mnt/swapfile
        sudo fallocate -l 12G /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
        sudo sysctl vm.swappiness=10

        # 系统更新 + 依赖安装
        sudo -E apt-get -yqq purge firefox snapd thunderbird
        sudo -E apt-get -yqq update
        sudo -E apt-get -yqq full-upgrade

        # ✅ 合并安装，减少 apt 调用次数
        sudo -E apt-get -yqq install clang llvm dwarves build-essential \
          libssl-dev libelf-dev bc flex bison python3 xz-utils tar \
          dos2unix libfuse-dev ccache gettext libncurses-dev qemu-utils

        # ImmortalWrt 官方依赖脚本
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

        # pnpm for daed frontend
        sudo npm install -g pnpm

        # 清理
        sudo -E apt-get -yqq autoremove --purge
        sudo -E apt-get -yqq clean
        sudo -E timedatectl set-timezone "$TZ"

        sudo mkdir -p /workdir
        sudo chown "$USER":"$USER" /workdir

        echo "📊 磁盘空间:" && df -hT
        echo "💾 内存/Swap:" && free -h

    # =========================================================
    # 2. 克隆源码
    # =========================================================
    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    # =========================================================
    # 3. 加载自定义 Feeds
    # =========================================================
    - name: Load custom feeds (diy-part1.sh)
      run: |
        [ -e "$FEEDS_CONF" ] && cp "$FEEDS_CONF" openwrt/feeds.conf.default
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    # =========================================================
    # 4. 更新并安装 Feeds
    # =========================================================
    - name: Update & install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # =========================================================
    # 5. 加载自定义配置
    # =========================================================
    - name: Load custom configuration (diy-part2.sh)
      run: |
        [ -e files ] && cp -r files openwrt/files
        [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: Load custom configuration (diy-part3.sh)
      run: |
        [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
        chmod +x "$DIY_P3_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P3_SH"

    # =========================================================
    # 5.5 ✅ 新增：ccache 缓存恢复
    # =========================================================
    - name: Restore ccache
      uses: actions/cache/restore@v5
      with:
        path: /home/runner/.ccache
        key: ccache-${{ env.DEVICE_NAME }}-${{ hashFiles('openwrt/.config') }}
        restore-keys: |
          ccache-${{ env.DEVICE_NAME }}-

    # =========================================================
    # 5.6 生成 Toolchain 缓存 Key
    # =========================================================
    - name: Generate toolchain cache key
      id: cache-key
      run: |
        cd openwrt
        make defconfig 1>/dev/null 2>&1

        TARGET=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
        SUBTARGET=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)

        TOOLS_HASH=$(find tools toolchain -type f \( -name "Makefile" -o -name "*.mk" \) \
          -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1)

        CACHE_KEY="toolchain-${TARGET}-${SUBTARGET}-${TOOLS_HASH:0:16}"
        CACHE_PREFIX="toolchain-${TARGET}-${SUBTARGET}"

        echo "CACHE_KEY=$CACHE_KEY" >> "$GITHUB_OUTPUT"
        echo "CACHE_PREFIX=$CACHE_PREFIX" >> "$GITHUB_OUTPUT"
        echo "🔑 Cache Key: $CACHE_KEY"

    # =========================================================
    # 5.7 恢复 Toolchain (actions/cache)
    # =========================================================
    - name: Restore toolchain from actions/cache
      uses: actions/cache/restore@v5
      id: cache-restore
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    # =========================================================
    # 5.8 恢复 Toolchain (Release backup)
    # =========================================================
    - name: Restore toolchain from Release backup
      if: steps.cache-restore.outputs.cache-hit != 'true'
      id: release-restore
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt
        CACHE_KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
        ASSET_NAME="${CACHE_KEY}.tzst"

        if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "restored=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" \
          --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$ASSET_NAME"; then
          echo "📦 Downloading: $ASSET_NAME"
          gh release download toolchain-cache --repo "$GITHUB_REPOSITORY" -p "$ASSET_NAME" -D .
          
          if [ -e "$ASSET_NAME" ]; then
            tar -I unzstd -xf "$ASSET_NAME" || tar -xf "$ASSET_NAME"
            rm -f "$ASSET_NAME"
            echo "restored=true" >> "$GITHUB_OUTPUT"
            echo "✅ Release restore success"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "restored=false" >> "$GITHUB_OUTPUT"
        fi

    # =========================================================
    # 5.9 处理 Toolchain
    # =========================================================
    - name: Handle toolchain
      id: toolchain
      run: |
        cd openwrt
        CACHE_HIT="${{ steps.cache-restore.outputs.cache-hit }}"
        RELEASE_HIT="${{ steps.release-restore.outputs.restored }}"

        if [ "$CACHE_HIT" = "true" ]; then
          echo "✅ actions/cache hit"
          echo "need_build=false" >> "$GITHUB_OUTPUT"
          echo "need_save_cache=false" >> "$GITHUB_OUTPUT"
          echo "need_save_release=false" >> "$GITHUB_OUTPUT"
        elif [ "$RELEASE_HIT" = "true" ]; then
          echo "✅ Release cache hit, will re-save to actions/cache"
          echo "need_build=false" >> "$GITHUB_OUTPUT"
          echo "need_save_cache=true" >> "$GITHUB_OUTPUT"
          echo "need_save_release=false" >> "$GITHUB_OUTPUT"
        else
          echo "⏳ No cache, building toolchain..."
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s || { echo "❌ tools failed"; exit 1; }
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s || { echo "❌ toolchain failed"; exit 1; }
          echo "✅ Toolchain built"
          echo "need_build=true" >> "$GITHUB_OUTPUT"
          echo "need_save_cache=true" >> "$GITHUB_OUTPUT"
          echo "need_save_release=true" >> "$GITHUB_OUTPUT"
        fi

        sed -i 's/ $(tool.*\/stamp-compile)//' Makefile

    # =========================================================
    # 5.10 Save toolchain to actions/cache
    # =========================================================
    - name: Save toolchain to actions/cache
      uses: actions/cache/save@v5
      if: steps.toolchain.outputs.need_save_cache == 'true'
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    # =========================================================
    # 5.11 Save toolchain to Release backup
    # =========================================================
    - name: Save toolchain to Release backup
      if: steps.toolchain.outputs.need_save_release == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt
        CACHE_KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
        CACHE_PREFIX="${{ steps.cache-key.outputs.CACHE_PREFIX }}"

        tar -I zstdmt -cf "${CACHE_KEY}.tzst" staging_dir/host* staging_dir/tool*
        
        if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release create toolchain-cache --repo "$GITHUB_REPOSITORY" \
            --title "Toolchain Cache" --notes "Auto-generated" --latest=false
        fi

        # 清理旧缓存
        gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" \
          --json assets -q '.assets[].name' 2>/dev/null | \
          grep "^${CACHE_PREFIX}" | while read -r old_file; do
            gh release delete-asset toolchain-cache "$old_file" --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
          done

        gh release upload toolchain-cache "${CACHE_KEY}.tzst" --repo "$GITHUB_REPOSITORY" --clobber
        rm -f "${CACHE_KEY}.tzst"

    # =========================================================
    # 6. SSH 调试
    # =========================================================
    - name: SSH connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')

    # =========================================================
    # 7. ✅ 下载软件包（增加重试 + 容错）
    # =========================================================
    - name: Download packages
      id: package
      run: |
        cd openwrt
        make defconfig
        
        # ✅ 最多重试 3 次下载
        for i in 1 2 3; do
          echo "📥 Download attempt $i/3..."
          if make download -j8; then
            echo "✅ Download success on attempt $i"
            break
          fi
          if [ "$i" -eq 3 ]; then
            echo "❌ Download failed after 3 attempts"
            # 列出失败的文件便于排查
            find dl -size -1024c -exec ls -la {} \;
            exit 1
          fi
          sleep 5
        done
        
        # 清理不完整文件
        find dl -size -1024c -exec rm -f {} \;

    # =========================================================
    # 8. 编译固件（✅ 集成 ccache）
    # =========================================================
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        
        # ✅ 启用 ccache
        export CCACHE_DIR=/home/runner/.ccache
        export CCACHE_COMPRESS=true
        export CCACHE_MAXSIZE=2G
        ccache -z  # 重置统计
        
        echo "🔨 Compiling with $(nproc) threads + ccache..."
        df -hT /

        if make -j"$(nproc)"; then
          echo "✅ Multi-thread build success"
        elif make -j1; then
          echo "✅ Single-thread fallback success"
        elif make -j1 V=s; then
          echo "✅ Verbose single-thread success"
        else
          echo "❌ Build failed"
          ccache -s
          exit 1
        fi

        ccache -s  # 打印缓存命中统计
        echo "status=success" >> "$GITHUB_OUTPUT"
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    # =========================================================
    # 8.5 ✅ 保存 ccache
    # =========================================================
    - name: Save ccache
      uses: actions/cache/save@v5
      if: always()
      with:
        path: /home/runner/.ccache
        key: ccache-${{ env.DEVICE_NAME }}-${{ hashFiles('openwrt/.config') }}

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    # =========================================================
    # 9. ✅ 仅上传 targets 目录（而非整个 bin）
    # =========================================================
    - name: Upload bin directory
      uses: actions/upload-artifact@v5
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin_${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin/targets  # ⬅️ 只上传 targets，排除 packages/kmods 等

    # =========================================================
    # 10. 整理固件文件
    # =========================================================
    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@v5
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # =========================================================
    # 11. 生成发布标签和日志
    # =========================================================
    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        AUTHOR=$(echo "${{ env.REPO_URL }}" | cut -d'/' -f4)
        BUILD_TIME=$(date +"%Y%m%d-%H%M")
        RELEASE_TAG="${{ env.DEVICE_NAME }}-${AUTHOR}-${{ env.REPO_BRANCH }}-${BUILD_TIME}"
        RELEASE_TAG=$(echo "$RELEASE_TAG" | sed 's/[^a-zA-Z0-9._-]/-/g')

        echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

        cat > release.txt << EOF
        ## 🚀 OpenWrt Auto Build
        
        | Item | Detail |
        |------|--------|
        | 📱 Device | \`${{ env.DEVICE_NAME }}\` |
        | 👤 Author | \`${AUTHOR}\` |
        | 🔗 Source | ${{ env.REPO_URL }} |
        | 🌿 Branch | \`${{ env.REPO_BRANCH }}\` |
        | ⏰ Built | $(date '+%Y-%m-%d %H:%M:%S') CST |
        | 🏷️ Tag | \`${RELEASE_TAG}\` |
        
        ---
        > ⚠️ Choose Factory or Sysupgrade image based on your installation method.
        EOF

        echo "status=success" >> "$GITHUB_OUTPUT"

    # =========================================================
    # 12. 发布到 GitHub Release
    # =========================================================
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2.3.2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*.bin
          ${{ env.FIRMWARE }}/*.ipk
          ${{ env.FIRMWARE }}/*.img.gz
          ${{ env.FIRMWARE }}/*.manifest
          ${{ env.FIRMWARE }}/*.tar.gz

    # =========================================================
    # 13 & 14. 清理
    # =========================================================
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 1
        keep_minimum_runs: 10

    - name: Remove old releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 10
        delete_tags: true
        delete_tag_pattern: '^${{ env.DEVICE_NAME }}-'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
